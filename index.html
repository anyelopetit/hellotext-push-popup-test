<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba de popup con push</title>
    <style>
      body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #252432; background: #fff; }
      .site-header { padding: 20px 32px; border-bottom: 1px solid #e4e2ec; font-weight: 700; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 20px 120px; }
      .status { margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: #f1eefc; font-size: 14px; }
      .warning { margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: #fff4e5; font-size: 14px; }
      code { font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="site-header">Prueba de popup con push</div>
    <main>
      <h1>Página de prueba con Hellotext.js publicado</h1>
      <p>Esta página carga el SDK publicado y usa la API de producción. Cualquier suscripción, cupón o mensaje que se genere es real.</p>
      <div class="warning" id="config"></div>
      <div class="status" id="status">Permiso de notificaciones: <code id="permission">…</code> · SDK: <span id="state">sin inicializar</span></div>
    </main>

    <script src="./hellotext.js"></script>
    <script>
      // Defaults are the production business and popup under test; ?business= and ?popup= override them.
      const DEFAULT_BUSINESS = 'zkWNdJBg'
      const DEFAULT_POPUP = '14k8Lk5e'

      const params = new URLSearchParams(window.location.search)
      const business = params.get('business') || DEFAULT_BUSINESS
      const popup = params.get('popup') || DEFAULT_POPUP
      const state = document.getElementById('state')
      const permission = document.getElementById('permission')
      const config = document.getElementById('config')

      config.textContent = `Negocio ${business} · popup ${popup} · API de producción`
      const refresh = () => {
        permission.textContent = typeof Notification === 'undefined' ? 'no disponible' : Notification.permission
      }
      refresh()
      setInterval(refresh, 1000)

      state.textContent = 'inicializando'
      // No apiRoot on purpose: the SDK defaults to production.
      // The service worker is relative so the page works under /<repo>/ on GitHub Pages.
      Hellotext.initialize(business, {
        popup: { id: popup },
        push: { serviceWorkerUrl: './hellotext-sw.js' },
      })
        .then(() => { state.textContent = 'listo' })
        .catch(error => { state.textContent = `error: ${error.message}` })
    </script>
  </body>
</html>
